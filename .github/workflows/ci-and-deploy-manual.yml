name: 'CI + CD Manual: dispatch plan -> approve -> apply'

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment name'
        required: true
        type: choice
        options:
          - dev
          - prod
      approval_environment:
        description: 'GitHub Environment in tf-ci used as approval gate before apply'
        required: true
        type: string
        default: 'production'
      working_directory:
        description: 'Path to Terraform root in source repo'
        required: true
        type: string
        default: './infra'
      tfvars_file:
        description: 'Optional tfvars path; empty uses environments/<environment>.tfvars'
        required: false
        type: string
        default: ''
      backend_key:
        description: 'Optional backend key; empty uses cross-repo/<environment>.terraform.tfstate'
        required: false
        type: string
        default: ''
      source_ref:
        description: 'Optional source git ref; empty uses selected workflow ref'
        required: false
        type: string
        default: ''
      tf_cd_ref:
        description: 'Git ref in tf-cd repository used for plan/apply workflows'
        required: true
        type: string
        default: 'main'
      terraform_version:
        description: 'Terraform version passed to tf-cd workflows'
        required: false
        type: string
        default: 'latest'
      use_oidc:
        description: 'Use OIDC auth instead of SPN client secret in tf-cd workflows'
        required: false
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

jobs:
  prepare:
    name: 'Prepare Inputs'
    runs-on: ubuntu-latest
    outputs:
      tfvars_file: ${{ steps.resolve.outputs.tfvars_file }}
      backend_key: ${{ steps.resolve.outputs.backend_key }}
      source_ref: ${{ steps.resolve.outputs.source_ref }}
    steps:
      - name: Resolve derived inputs
        id: resolve
        run: |
          TFVARS_FILE='${{ inputs.tfvars_file }}'
          BACKEND_KEY='${{ inputs.backend_key }}'
          SOURCE_REF='${{ inputs.source_ref }}'

          if [ -z "$TFVARS_FILE" ]; then
            TFVARS_FILE="environments/${{ inputs.environment }}.tfvars"
          fi

          if [ -z "$BACKEND_KEY" ]; then
            BACKEND_KEY="cross-repo/${{ inputs.environment }}.terraform.tfstate"
          fi

          if [ -z "$SOURCE_REF" ]; then
            SOURCE_REF='${{ github.ref_name }}'
          fi

          echo "tfvars_file=$TFVARS_FILE" >> "$GITHUB_OUTPUT"
          echo "backend_key=$BACKEND_KEY" >> "$GITHUB_OUTPUT"
          echo "source_ref=$SOURCE_REF" >> "$GITHUB_OUTPUT"

  format:
    name: '🎨 Format Check'
    runs-on: ubuntu-latest
    needs: [prepare]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source_ref }}
      - uses: hashicorp/setup-terraform@v3
      - name: terraform fmt
        run: terraform fmt -check -recursive -diff ${{ inputs.working_directory }}

  validate:
    name: '✅ Validate'
    runs-on: ubuntu-latest
    needs: [prepare]
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source_ref }}
      - uses: hashicorp/setup-terraform@v3
      - run: terraform init -backend=false
      - run: terraform validate -no-color

  tflint:
    name: '🔍 TFLint'
    runs-on: ubuntu-latest
    needs: [prepare]
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source_ref }}
      - uses: hashicorp/setup-terraform@v3
      - run: terraform init -backend=false
      - uses: terraform-linters/setup-tflint@v4
      - run: tflint --init && tflint --format compact --force

  trivy:
    name: '🛡️ Trivy Security'
    needs: [prepare, format, validate, tflint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source_ref }}
      - uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: ${{ inputs.working_directory }}
          format: 'table'
          exit-code: '1'
          severity: 'HIGH,CRITICAL'

  plan:
    name: '📋 Dispatch Plan in tf-cd'
    needs: [prepare, trivy]
    runs-on: ubuntu-latest
    outputs:
      run_id: ${{ steps.dispatch.outputs.run_id }}
      html_url: ${{ steps.dispatch.outputs.html_url }}
    steps:
      - name: Validate dispatch token
        run: |
          if [ -z '${{ secrets.TF_CD_DISPATCH_TOKEN }}' ]; then
            echo 'Missing TF_CD_DISPATCH_TOKEN secret in tf-ci'
            exit 1
          fi

      - name: Dispatch tf-cd plan workflow
        id: dispatch
        env:
          GH_TOKEN: ${{ secrets.TF_CD_DISPATCH_TOKEN }}
        run: |
          if [ '${{ inputs.use_oidc }}' = 'true' ]; then
            USE_OIDC=true
          else
            USE_OIDC=false
          fi

          PAYLOAD=$(jq -n \
            --arg ref '${{ inputs.tf_cd_ref }}' \
            --arg environment '${{ inputs.environment }}' \
            --arg working_directory '${{ inputs.working_directory }}' \
            --arg tfvars_file '${{ needs.prepare.outputs.tfvars_file }}' \
            --arg backend_key '${{ needs.prepare.outputs.backend_key }}' \
            --arg terraform_version '${{ inputs.terraform_version }}' \
            --arg source_repository '${{ github.repository }}' \
            --arg source_ref '${{ needs.prepare.outputs.source_ref }}' \
            --argjson use_oidc "$USE_OIDC" \
            '{
              ref: $ref,
              inputs: {
                environment: $environment,
                working_directory: $working_directory,
                tfvars_file: $tfvars_file,
                backend_key: $backend_key,
                terraform_version: $terraform_version,
                source_repository: $source_repository,
                source_ref: $source_ref,
                use_oidc: $use_oidc
              }
            }')

          RESPONSE=$(curl -fsSL \
            -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            https://api.github.com/repos/jakubgitcode/tf-cd/actions/workflows/reusable-plan.yml/dispatches \
            -d "$PAYLOAD")

          RUN_ID=$(echo "$RESPONSE" | jq -r '.workflow_run_id')
          HTML_URL=$(echo "$RESPONSE" | jq -r '.html_url')

          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = 'null' ]; then
            echo 'Could not determine plan workflow run id'
            echo "$RESPONSE"
            exit 1
          fi

          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "html_url=$HTML_URL" >> "$GITHUB_OUTPUT"

      - name: Wait for tf-cd plan completion
        env:
          GH_TOKEN: ${{ secrets.TF_CD_DISPATCH_TOKEN }}
        run: |
          RUN_ID='${{ steps.dispatch.outputs.run_id }}'

          for ATTEMPT in $(seq 1 120); do
            RESPONSE=$(curl -fsSL \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              https://api.github.com/repos/jakubgitcode/tf-cd/actions/runs/$RUN_ID)

            STATUS=$(echo "$RESPONSE" | jq -r '.status')
            CONCLUSION=$(echo "$RESPONSE" | jq -r '.conclusion // ""')
            HTML_URL=$(echo "$RESPONSE" | jq -r '.html_url')

            echo "Plan run status=$STATUS conclusion=${CONCLUSION:-pending} url=$HTML_URL"

            if [ "$STATUS" = 'completed' ]; then
              if [ "$CONCLUSION" != 'success' ]; then
                exit 1
              fi
              exit 0
            fi

            sleep 15
          done

          echo 'Timed out waiting for tf-cd plan workflow'
          exit 1

      - name: Plan Summary
        run: |
          echo '## Manual tf-cd Plan' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '| Parametr | Wartość |' >> "$GITHUB_STEP_SUMMARY"
          echo '|----------|---------|' >> "$GITHUB_STEP_SUMMARY"
          echo "| Environment | \\`${{ inputs.environment }}\\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Source repo | \\`${{ github.repository }}\\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Source ref | \\`${{ needs.prepare.outputs.source_ref }}\\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Plan run | ${{ steps.dispatch.outputs.html_url }} |" >> "$GITHUB_STEP_SUMMARY"

  approve-apply:
    name: '🛑 Approve Apply'
    needs: [plan]
    runs-on: ubuntu-latest
    environment: ${{ inputs.approval_environment }}
    steps:
      - name: Await approval
        run: |
          echo 'Plan verified. Approve this job to dispatch apply in tf-cd.'
          echo 'Plan URL: ${{ needs.plan.outputs.html_url }}'

  apply:
    name: '🚀 Dispatch Apply in tf-cd'
    needs: [prepare, plan, approve-apply]
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch tf-cd apply workflow
        id: dispatch
        env:
          GH_TOKEN: ${{ secrets.TF_CD_DISPATCH_TOKEN }}
        run: |
          if [ '${{ inputs.use_oidc }}' = 'true' ]; then
            USE_OIDC=true
          else
            USE_OIDC=false
          fi

          PAYLOAD=$(jq -n \
            --arg ref '${{ inputs.tf_cd_ref }}' \
            --arg environment '${{ inputs.environment }}' \
            --arg working_directory '${{ inputs.working_directory }}' \
            --arg backend_key '${{ needs.prepare.outputs.backend_key }}' \
            --arg terraform_version '${{ inputs.terraform_version }}' \
            --arg source_repository '${{ github.repository }}' \
            --arg source_ref '${{ needs.prepare.outputs.source_ref }}' \
            --arg plan_run_id '${{ needs.plan.outputs.run_id }}' \
            --argjson use_oidc "$USE_OIDC" \
            '{
              ref: $ref,
              inputs: {
                environment: $environment,
                github_environment: "",
                working_directory: $working_directory,
                backend_key: $backend_key,
                terraform_version: $terraform_version,
                source_repository: $source_repository,
                source_ref: $source_ref,
                plan_run_id: $plan_run_id,
                use_oidc: $use_oidc
              }
            }')

          RESPONSE=$(curl -fsSL \
            -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            https://api.github.com/repos/jakubgitcode/tf-cd/actions/workflows/reusable-apply.yml/dispatches \
            -d "$PAYLOAD")

          RUN_ID=$(echo "$RESPONSE" | jq -r '.workflow_run_id')
          HTML_URL=$(echo "$RESPONSE" | jq -r '.html_url')

          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = 'null' ]; then
            echo 'Could not determine apply workflow run id'
            echo "$RESPONSE"
            exit 1
          fi

          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "html_url=$HTML_URL" >> "$GITHUB_OUTPUT"

      - name: Wait for tf-cd apply completion
        env:
          GH_TOKEN: ${{ secrets.TF_CD_DISPATCH_TOKEN }}
        run: |
          RUN_ID='${{ steps.dispatch.outputs.run_id }}'

          for ATTEMPT in $(seq 1 120); do
            RESPONSE=$(curl -fsSL \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              https://api.github.com/repos/jakubgitcode/tf-cd/actions/runs/$RUN_ID)

            STATUS=$(echo "$RESPONSE" | jq -r '.status')
            CONCLUSION=$(echo "$RESPONSE" | jq -r '.conclusion // ""')
            HTML_URL=$(echo "$RESPONSE" | jq -r '.html_url')

            echo "Apply run status=$STATUS conclusion=${CONCLUSION:-pending} url=$HTML_URL"

            if [ "$STATUS" = 'completed' ]; then
              if [ "$CONCLUSION" != 'success' ]; then
                exit 1
              fi
              exit 0
            fi

            sleep 15
          done

          echo 'Timed out waiting for tf-cd apply workflow'
          exit 1

      - name: Apply Summary
        run: |
          echo '## Manual tf-cd Apply' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '| Parametr | Wartość |' >> "$GITHUB_STEP_SUMMARY"
          echo '|----------|---------|' >> "$GITHUB_STEP_SUMMARY"
          echo "| Environment | \\`${{ inputs.environment }}\\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Apply run | ${{ steps.dispatch.outputs.html_url }} |" >> "$GITHUB_STEP_SUMMARY"